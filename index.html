<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<style>html.boot-handoff-pre { background: #060814; }</style>
<script>
// 로그인/로그아웃 직후 새로고침된 경우, 첫 화면이 그려지기 전에(본문이 파싱되기 전에)
// 미리 표시해둬서 검은 "Loading..." 화면이 한 프레임이라도 비치지 않게 한다.
try {
  if (sessionStorage.getItem("app:just-logged-in") === "1" || sessionStorage.getItem("app:just-logged-out") === "1") {
    document.documentElement.classList.add("boot-handoff-pre");
  }
} catch (e) {}
</script>
<title>업무 종합 관리</title>
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" type="image/png" sizes="192x192" href="favicon-192x192.png">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/font-kopub@1.0/kopubdotum.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/font-kopub@1.0/kopubbatang.min.css">
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<link rel="stylesheet" href="styles.min.css">
</head>
<body>
<div id="boot-loader"><b>Loading...</b><div class="boot-loader-bar"><i></i></div></div>
<script>
(function () {
  try {
    var m = localStorage.getItem("app-theme-mode");
    if (!m) document.documentElement.setAttribute("data-theme", "light");
    else if (m !== "dark") document.documentElement.setAttribute("data-theme", m);
  } catch (e) {}
  window.__bootStart = Date.now();
  // 방금 로그인/계정 생성으로 들어온 경우(로그인 화면이 새로고침을 거쳐 앱으로 넘어가는 중)에는
  // "Loading..." 문구 없이 로그인 화면과 같은 배경만 잠깐 덮어뒀다가, 앱이 준비되면 곧바로
  // 부드럽게 걷어낸다(최소 대기 시간 없음).
  window.__bootHandoff = false;
  try { window.__bootHandoff = sessionStorage.getItem("app:just-logged-in") === "1"; } catch (e) {}
  // 방금 로그아웃해서 새로고침된 경우에도 "Loading..." 없이 같은 방식으로 로그인 화면으로 넘어간다.
  // (이 표시는 여기서 바로 읽고 지운다 — 다음 새로고침에는 영향을 주지 않도록)
  try {
    if (sessionStorage.getItem("app:just-logged-out") === "1") {
      window.__bootHandoff = true;
      sessionStorage.removeItem("app:just-logged-out");
    }
  } catch (e) {}
  if (window.__bootHandoff) {
    var bl = document.getElementById("boot-loader");
    if (bl) { bl.className = "boot-handoff"; bl.innerHTML = ""; }
  }
  // 로그인 화면이든 앱 화면이든, 실제로 그릴 준비가 끝난 시점에 이 함수를
  // 한 번 호출해준다. 부팅 화면이 뜬 지 2초가 안 됐으면 2초를 채운 뒤에,
  // 이미 2초가 지났으면 곧바로 서서히 사라진다.
  window.__hideBootLoader = function () {
    var el = document.getElementById("boot-loader");
    if (!el || el.dataset.hiding) return;
    el.dataset.hiding = "1";
    var elapsed = Date.now() - (window.__bootStart || Date.now());
    var wait = window.__bootHandoff ? 0 : Math.max(0, 2000 - elapsed);
    setTimeout(function () {
      el.classList.add("boot-loader-hide");
      setTimeout(function () {
        if (el && el.parentNode) el.parentNode.removeChild(el);
        document.documentElement.classList.remove("boot-handoff-pre");
      }, window.__bootHandoff ? 800 : 550);
    }, wait);
  };
})();
</script>
<!-- ============================================================
     상단 상태표시줄
     macOS 목업(ate1ier-macos-mockup)의 상단 바를 참고해 구성했습니다.
     - 왼쪽: 앱 아이콘 · 로그인한 계정 이름(목업의 #an처럼, 예전엔 "업무 종합 관리"
       고정 문구였던 자리 — 눌러서 로그아웃 드롭다운을 여는 실제 기능,
       js/01n-status-bar-account.js) · "모드"(테마 라이트/다크 전환 — 예전에 오른쪽 아래
       "설정" 메뉴 안에 있던 걸 여기로 옮김, js/01m-status-bar-mode.js) ·
       "백업"(눌러서 지금 백업하기 · 백업에서 복원 드롭다운 — js/01o-status-bar-backup.js) · "설명"(누르면 사용설명서 창이 열림 — js/01p-status-bar-help.js) · "디스코드"(예전에 오른쪽 아래 "설정" 메뉴 안에 있던 디스코드 채널 바로가기 — 누르면 새 탭에서 열림, js/01s-status-bar-discord.js)
     - 오른쪽: 새로고침 · 되돌리기 · 검색 아이콘(예전에 오른쪽 아래 바로가기 메뉴와
       하단 내비게이션 독에 있던 기능을 여기로 옮김 — 새로고침·되돌리기는
       js/01q-status-bar-refresh-undo.js, 검색은 js/01r-status-bar-search.js),
       동기화 상태(실제 저장 상태와 연동 — 저장 중/완료/실패에 따라 강조 표시됨,
       js/01b-cloud-sync-core.js), 날짜·시간(실시간으로 갱신되고, 누르면 목업의 알림
       센터(#nc)처럼 우측에서 "오늘의 브리핑" 사이드바가 열림 — js/14-briefing-sidebar.js)
============================================================ -->
<div id="app-status-bar">
  <button type="button" id="status-bar-account-btn" class="status-bar-brand status-bar-account-btn" aria-haspopup="true" aria-expanded="false" title="계정">
    <i class="status-bar-logo" aria-hidden="true">◆</i>
    <b class="status-bar-title" id="status-bar-account-name">업무 종합 관리</b>
  </button>
  <button type="button" id="status-bar-mode-btn" class="status-bar-menu-item" aria-haspopup="true" aria-expanded="false" title="모드 (테마 · 라이트/다크)">모드</button>
  <button type="button" id="status-bar-backup-btn" class="status-bar-menu-item" aria-haspopup="true" aria-expanded="false" title="백업">백업</button>
  <button type="button" id="status-bar-help-btn" class="status-bar-menu-item" title="사용설명서">설명</button>
  <button type="button" id="status-bar-discord-btn" class="status-bar-menu-item" title="디스코드 채널 (새 탭에서 열림)">디스코드</button>
  <i class="status-bar-spacer"></i>
  <button type="button" id="status-bar-master-return-btn" class="status-bar-menu-item status-bar-master-return" title="마스터 계정으로 돌아가기" hidden>🛡 마스터로 복귀</button>
  <button type="button" id="status-bar-refresh-btn" class="status-bar-icon" aria-label="최신 내용으로 새로고침" title="최신 내용으로 새로고침">↻</button>
  <button type="button" id="status-bar-undo-btn" class="status-bar-icon" aria-label="되돌리기" title="되돌릴 작업이 없어요" disabled>↶</button>
  <button type="button" id="status-bar-search-btn" class="status-bar-icon status-bar-icon--svg" aria-haspopup="true" aria-expanded="false" aria-label="이름 통합 검색" title="이름 통합 검색">
    <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5L21 21"/></svg>
  </button>
  <span class="status-bar-sync" id="status-bar-sync" aria-live="polite">
    <i class="status-bar-dot" id="status-bar-sync-dot"></i>
    <span class="status-bar-sync-label" id="status-bar-sync-label">동기화</span>
  </span>
  <button type="button" id="status-bar-clock-btn" class="status-bar-clock status-bar-clock-btn" aria-haspopup="true" aria-expanded="false" title="오늘의 브리핑">9월 24일 목요일 오후 3:24</button>
</div>
<div id="status-bar-search-panel" class="status-bar-search-panel" role="dialog" aria-label="이름 통합 검색">
  <div id="global-search-root"></div>
</div>
<!-- 홈 화면 전용: 오른쪽 데스크톱 아이콘 + 하단 독 (js/09a-home-desktop.js, css/01b-home-desktop.css) -->
<div id="home-icons"></div>
<!-- 바탕화면 우클릭으로 만든 폴더 아이콘이 놓이는 투명 층 (js/09b-desktop-folders.js, css/01d-desktop-folders.css) -->
<div id="hd-folders"></div>
<!-- macOS 폴더 아이콘의 그라데이션 정의(모든 폴더 아이콘이 url(#dfg-back)/url(#dfg-front)로 함께 씀).
     display:none으로 숨기면 일부 브라우저에서 그라데이션이 안 먹으므로 크기 0으로 둔다 -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false"><defs>
  <linearGradient id="dfg-back" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#55b5fb"/><stop offset="1" stop-color="#2c7fe4"/></linearGradient>
  <linearGradient id="dfg-front" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#a3dfff"/><stop offset="0.55" stop-color="#6ec4fc"/><stop offset="1" stop-color="#48a6f6"/></linearGradient>
</defs></svg>
<div id="home-dock"></div>
<!-- 홈 위젯(#wg)이 그려지는 자리. 일반 계정은 바탕화면 위에 위젯이 항상 떠 있고, 각 페이지는 아래 #page-area 창 안에 열린다 (js/12-init.js renderApp) -->
<div id="home-root"></div>
<div id="layout">
  <div id="page-area">
    <!-- 바탕화면 위 앱 창의 제목줄 (macOS 목업의 .tb). 일반 계정에서만 보임 — js/09a-home-desktop.js, css/01c-app-window.css -->
    <div id="app-win-bar" class="aw-tb">
      <div class="aw-tl">
        <button type="button" class="aw-tlb" data-win="close" data-g="✕" style="--c:#ff5f57" aria-label="창 닫기" title="닫기"></button>
        <button type="button" class="aw-tlb" data-win="min" data-g="−" style="--c:#febc2e" aria-label="창 내리기" title="내리기"></button>
        <button type="button" class="aw-tlb" data-win="max" data-g="⤢" style="--c:#28c840" aria-label="창 크게/작게" title="크게/작게"></button>
      </div>
      <div class="aw-tt" id="app-win-title"></div>
      <div class="aw-tr"></div>
    </div>
    <div id="page-inner"></div>
  </div>
  <!-- 일반 계정 전용: 여러 개 동시에 뜨는 앱 창들이 여기 담긴다(js/09a-home-desktop.js가 아이콘/독을 누를 때마다
       .app-win을 하나씩 만들어 넣는다). 위 #page-area는 로그인 화면·마스터 계정 전용으로 그대로 남아 있다. -->
  <div id="hd-windows"></div>
  <div id="nav-dock">
    <div id="nav"></div>
  </div>
</div>
<!-- 되돌리기 결과 토스트(#undo-toast)가 그려지는 자리 (예전엔 오른쪽 아래 유틸리티 독 안에 있었음) -->
<div id="undo-toggle-root"></div>
<button class="dock-toggle-btn" id="dock-toggle-btn" type="button" aria-haspopup="true" aria-expanded="false" aria-label="메뉴 열기" title="메뉴 열기">
  <svg width="18" height="18" viewBox="0 0 14 14" aria-hidden="true"><path d="M2 5l5 4 5-4" stroke="currentColor" stroke-width="2.1" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
</button>
<script src="app.js"></script>
</body>
</html>
