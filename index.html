<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>업무 종합 관리</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/font-kopub@1.0/kopubdotum.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
  :root {
    --bg: #1e1e1e;
    --panel: #262626;
    --elevated: #323232;
    --hairline: #3f3f42;
    --text: #f2f2f2;
    --text-dim: #b8b8bc;
    --text-faint: #8a8a8e;
    --accent: #0a84ff;
    --accent-dim: #0a84ff2e;
    --accent-text: #ffffff;
    --green: #30d158;
    --green-dim: #30d1582e;
    --red: #ff453a;
    --red-dim: #ff453a2e;
    --blue: #64d2ff;
    --blue-dim: #64d2ff2e;
    --orange: #ff9f0a;
    --orange-dim: #ff9f0a2e;
    --salmon: #ff6961;
    --salmon-dim: #ff69612e;
    --yellow: #ffd60a;
    --yellow-dim: #ffd60a2e;
    --teal: #40c8e0;
    --teal-dim: #40c8e02e;
    --purple: #bf5af2;
    --purple-dim: #bf5af22e;
    --pink: #ff375f;
    --pink-dim: #ff375f2e;
    --indigo: #5e5ce6;
    --indigo-dim: #5e5ce62e;
    --edu: #32d74b;
    --edu-dim: #32d74b2e;
    --weekend-tint: #232324;
    --native-color-scheme: dark;
    --mac-radius: 10px;
    --mac-radius-lg: 14px;
    --mac-vibrancy: rgba(40, 40, 42, 0.72);
    --mac-vibrancy-hairline: rgba(255, 255, 255, 0.08);
    --mac-shadow: 0 8px 24px rgba(0, 0, 0, 0.35), 0 1px 0 rgba(255, 255, 255, 0.04) inset;
  }
  html[data-theme="light"] {
    --bg: #ececee;
    --panel: #ffffff;
    --elevated: #f2f2f5;
    --hairline: #d9d9de;
    --text: #1d1d1f;
    --text-dim: #55555a;
    --text-faint: #7c7c82;
    --accent: #007aff;
    --accent-dim: #007aff1f;
    --accent-text: #ffffff;
    --weekend-tint: #e4e4e8;
    --native-color-scheme: light;
    --mac-vibrancy: rgba(255, 255, 255, 0.62);
    --mac-vibrancy-hairline: rgba(0, 0, 0, 0.06);
    --mac-shadow: 0 8px 24px rgba(0, 0, 0, 0.12), 0 1px 0 rgba(255, 255, 255, 0.4) inset;
  }
  /* ---- 그레이 모드: 채도를 낮춘 중립 톤 ---- */
  html[data-theme="gray"] {
    --bg: #e7e8ea;
    --panel: #f2f3f4;
    --elevated: #dcdde0;
    --hairline: #c7c9cd;
    --text: #292a2d;
    --text-dim: #494a4e;
    --text-faint: #606266;
    --accent: #52606d;
    --accent-dim: #52606d26;
    --accent-text: #ffffff;
    --weekend-tint: #dbdce0;
    --native-color-scheme: light;
  }
  /* ---- 파스텔 스카이블루 ---- */
  html[data-theme="pastel-blue"] {
    --bg: #e9f1fb;
    --panel: #f5f9fd;
    --elevated: #dbeaf7;
    --hairline: #c3daf0;
    --text: #1f2a37;
    --text-dim: #435264;
    --text-faint: #576b80;
    --accent: #3b78c9;
    --accent-dim: #3b78c926;
    --accent-text: #ffffff;
    --weekend-tint: #d9e9f8;
    --native-color-scheme: light;
  }
  /* ---- 파스텔 세이지민트 ---- */
  html[data-theme="pastel-green"] {
    --bg: #e9f5ee;
    --panel: #f4faf6;
    --elevated: #daeee2;
    --hairline: #c2e1cd;
    --text: #1f2e24;
    --text-dim: #44564a;
    --text-faint: #5d6d63;
    --accent: #3f9463;
    --accent-dim: #3f946326;
    --accent-text: #ffffff;
    --weekend-tint: #d9edde;
    --native-color-scheme: light;
  }
  /* ---- 파스텔 피치 ---- */
  html[data-theme="pastel-peach"] {
    --bg: #fdeee6;
    --panel: #fff6f1;
    --elevated: #f8ded0;
    --hairline: #eeccb7;
    --text: #3a2a20;
    --text-dim: #60493b;
    --text-faint: #776155;
    --accent: #d97a4d;
    --accent-dim: #d97a4d26;
    --accent-text: #ffffff;
    --weekend-tint: #f7dcc7;
    --native-color-scheme: light;
  }
  /* ---- 파스텔 라벤더 ---- */
  html[data-theme="pastel-lavender"] {
    --bg: #f0ecfa;
    --panel: #f8f5fd;
    --elevated: #e4daf6;
    --hairline: #d2c1ed;
    --text: #2c2438;
    --text-dim: #514661;
    --text-faint: #695e7c;
    --accent: #8462cf;
    --accent-dim: #8462cf26;
    --accent-text: #ffffff;
    --weekend-tint: #e6d9f5;
    --native-color-scheme: light;
  }
  /* ---- light / gray / pastel-* 6개 테마는 상태색(오프·연차·대휴 등)이 모두 같다 ---- */
  html[data-theme="light"], html[data-theme="gray"], html[data-theme="pastel-blue"],
  html[data-theme="pastel-green"], html[data-theme="pastel-peach"], html[data-theme="pastel-lavender"] {
    --mac-vibrancy: rgba(255, 255, 255, 0.62);
    --mac-vibrancy-hairline: rgba(0, 0, 0, 0.06);
    --mac-shadow: 0 8px 24px rgba(0, 0, 0, 0.12), 0 1px 0 rgba(255, 255, 255, 0.4) inset;
    --green: #2c7f96;
    --green-dim: #2c7f9626;
    --red: #c94f4f;
    --red-dim: #c94f4f26;
    --blue: #3778b0;
    --blue-dim: #3778b026;
    --orange: #b9791e;
    --orange-dim: #b9791e26;
    --salmon: #c2603f;
    --salmon-dim: #c2603f26;
    --yellow: #8a6a1f;
    --yellow-dim: #8a6a1f26;
    --teal: #227d75;
    --teal-dim: #227d7526;
    --purple: #7454b5;
    --purple-dim: #7454b526;
    --pink: #b5548f;
    --pink-dim: #b5548f26;
    --indigo: #a554b6;
    --indigo-dim: #a554b626;
    --edu: #2f9e63;
    --edu-dim: #2f9e6326;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    color-scheme: var(--native-color-scheme, dark);
    font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'SF Pro KR', 'Apple SD Gothic Neo', 'Malgun Gothic', 'KoPub Dotum', system-ui, sans-serif;
    font-weight: 400;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }
  body { display: block; }
  button, input, textarea { font-family: inherit; }
  button:focus-visible, input:focus-visible, textarea:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  /* ---------- 레이아웃 / 내비게이션 ---------- */
  #layout {
    display: flex;
    min-height: 100vh;
  }
  #page-area {
    flex: 1;
    min-width: 0;
    padding: 24px 20px;
    display: flex;
    justify-content: center;
    position: relative;
  }
  #page-inner { width: 100%; max-width: 1400px; }
  #page-inner.wide { max-width: 1800px; }

  #nav {
    width: 158px;
    flex-shrink: 0;
    border-left: 1px solid var(--mac-vibrancy-hairline);
    background: var(--mac-vibrancy);
    backdrop-filter: blur(24px) saturate(1.8);
    -webkit-backdrop-filter: blur(24px) saturate(1.8);
    display: flex;
    flex-direction: column;
    align-items: stretch;
    padding: 28px 0;
    transition: width 0.18s ease;
    overflow: hidden;
  }
  #nav.collapsed { width: 60px; }
  .global-session-badge {
    display: none;
    align-items: center;
    gap: 4px;
    padding: 3px 10px;
    border-radius: 20px;
    background: var(--elevated);
    border: 1px solid var(--hairline);
    font-size: 11px;
    color: var(--text-faint);
    white-space: nowrap;
    max-width: 100%;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .global-session-badge.visible { display: inline-flex; }
  .nav-collapse-btn {
    background: none;
    border: 1px solid var(--hairline);
    color: var(--text-dim);
    width: 26px;
    height: 26px;
    border-radius: 8px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    align-self: flex-end;
    margin: 0 22px 14px auto;
    flex-shrink: 0;
    transition: color 0.15s ease, border-color 0.15s ease;
  }
  .nav-collapse-btn:hover { color: var(--text); border-color: var(--accent); }
  .nav-collapse-btn svg { transition: transform 0.18s ease; }
  #nav.collapsed .nav-collapse-btn { align-self: center; margin: 0 0 14px; }
  #nav.collapsed .nav-collapse-btn svg { transform: rotate(180deg); }
  #nav.collapsed .nav-label-top,
  #nav.collapsed .nav-text,
  #nav.collapsed .theme-picker-label,
  #nav.collapsed .theme-picker-chevron,
  #nav.collapsed .nav-master-banner,
  #nav.collapsed .nav-master-mode,
  #nav.collapsed .global-session-badge { display: none; }
  #nav.collapsed .nav-divider { margin: 0 14px 14px; }
  #nav.collapsed .nav-btn { text-align: center; padding: 12px 4px; }
  #nav.collapsed .nav-btn.active::before { left: 6px; }
  #nav.collapsed .nav-account { padding: 0 6px 10px; }
  #nav.collapsed .nav-logout-btn { padding: 4px; }
  #nav.collapsed .theme-picker-btn { justify-content: center; padding: 5px 3px; gap: 0; }

  .nav-label-top {
    font-size: 18px;
    letter-spacing: 0.12em;
    color: var(--text-faint);
    padding: 0 22px 12px;
    text-transform: uppercase;
  }
  .nav-divider {
    height: 1px;
    background: var(--hairline);
    margin: 0 22px 14px;
  }
  .nav-btn {
    position: relative;
    background: none;
    border: none;
    color: var(--text-dim);
    text-align: left;
    font-size: 14.5px;
    letter-spacing: -0.005em;
    padding: 9px 14px;
    margin: 1.5px 10px;
    border-radius: 8px;
    cursor: pointer;
    transition: color 0.12s ease, background 0.12s ease;
    width: calc(100% - 20px);
  }
  .icon-emo { display: inline-block; vertical-align: -3px; flex-shrink: 0; }
  .nav-btn:hover { color: var(--text); background: var(--mac-vibrancy-hairline); }
  .nav-btn.active {
    color: #ffffff;
    background: var(--accent);
    box-shadow: 0 1px 2px rgba(0,0,0,0.15);
  }
  .nav-btn.active::before { content: none; }
  .nav-spacer { flex: 1; }
  .nav-master-mode {
    margin: 0 8px 14px;
    padding: 9px 10px;
    border: 1px solid var(--accent);
    border-radius: 10px;
    background: var(--accent-dim);
    display: flex;
    flex-direction: column;
    gap: 3px;
  }
  .nav-master-mode-title {
    font-size: 13px; font-weight: 600; color: var(--accent); letter-spacing: -0.01em;
    line-height: 1.3; white-space: nowrap;
  }
  .nav-master-mode-sub {
    font-size: 11px; color: var(--text-dim); line-height: 1.3; white-space: nowrap;
  }
  .theme-toggle-wrap {
    position: fixed;
    right: 18px;
    bottom: 18px;
    z-index: 45;
    padding: 4px;
    margin: 0;
    border: 1px solid var(--mac-vibrancy-hairline);
    border-radius: 12px;
    background: var(--mac-vibrancy);
    backdrop-filter: blur(20px) saturate(1.8);
    -webkit-backdrop-filter: blur(20px) saturate(1.8);
    box-shadow: 0 10px 28px #00000045;
  }
  .theme-toggle-wrap .theme-picker-btn { width: auto; }
  #nav.collapsed .theme-toggle-wrap {
    padding: 4px 0;
    right: 0;
    width: 60px;
    display: flex;
    justify-content: center;
  }
  .theme-picker-btn {
    width: 100%;
    display: flex;
    align-items: center;
    gap: 5px;
    background: var(--elevated);
    border: 1px solid var(--hairline);
    border-radius: 9px;
    padding: 4px 6px;
    cursor: pointer;
    color: var(--text-dim);
    font-size: 11px;
    transition: border-color 0.15s ease, color 0.15s ease, box-shadow 0.15s ease;
  }
  .theme-picker-btn:hover { color: var(--text); border-color: var(--accent); }
  .theme-picker-btn.open { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-dim); color: var(--text); }
  .theme-picker-dot {
    width: 11px; height: 11px; border-radius: 50%; flex-shrink: 0;
    box-shadow: inset 0 0 0 2px #ffffff40, 0 0 0 1px #00000022;
  }
  .theme-picker-label {
    flex: 1; text-align: left; font-weight: 500; white-space: nowrap;
    overflow: hidden; text-overflow: ellipsis;
  }
  .theme-picker-chevron { color: var(--text-faint); flex-shrink: 0; transition: transform 0.15s ease; }
  .theme-picker-btn.open .theme-picker-chevron { transform: rotate(180deg); }

  .theme-menu {
    position: fixed; z-index: 60; background: var(--mac-vibrancy); border: 1px solid var(--mac-vibrancy-hairline);
    backdrop-filter: blur(20px) saturate(1.8); -webkit-backdrop-filter: blur(20px) saturate(1.8);
    border-radius: 12px; padding: 6px; display: flex; flex-direction: column; gap: 1px;
    box-shadow: 0 14px 36px #00000055; min-width: 180px;
  }
  .theme-menu-item {
    display: flex; align-items: center; gap: 9px; background: none; border: none; width: 100%;
    padding: 8px 9px; border-radius: 9px; cursor: pointer; color: var(--text); font-size: 13px; text-align: left;
  }
  .theme-menu-item:hover { background: var(--accent-dim); }
  .theme-menu-item.active { background: var(--accent-dim); font-weight: 600; }
  .theme-menu-dot {
    width: 15px; height: 15px; border-radius: 50%; flex-shrink: 0;
    box-shadow: inset 0 0 0 2px #ffffff40, 0 0 0 1px #00000022;
  }
  .theme-menu-name { flex: 1; white-space: nowrap; }
  .theme-menu-check { color: var(--accent); font-weight: 700; flex-shrink: 0; }

  /* ---------- 데스크톱: 평소엔 숨겨진 macOS 독(Dock) + 가운데 하단 펼치기 버튼 ---------- */
  .dock-toggle-btn { display: none; }
  #theme-toggle-root .theme-toggle-wrap { position: fixed; right: 14px; bottom: 78px; z-index: 46; }
  @media (min-width: 721px) {
    #theme-toggle-root .theme-toggle-wrap { bottom: 18px; }
    #page-area { padding-bottom: 56px; }
    .dock-toggle-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      position: fixed;
      left: 50%;
      bottom: 14px;
      transform: translateX(-50%);
      z-index: 41;
      width: 46px;
      height: 20px;
      padding: 0;
      border: 1px solid var(--mac-vibrancy-hairline);
      border-radius: 10px;
      background: var(--mac-vibrancy);
      backdrop-filter: blur(20px) saturate(1.8);
      -webkit-backdrop-filter: blur(20px) saturate(1.8);
      box-shadow: 0 8px 22px rgba(0, 0, 0, 0.35);
      color: var(--text-faint);
      cursor: pointer;
      transition: color 0.12s ease;
    }
    .dock-toggle-btn:hover { color: var(--text); }
    .dock-toggle-btn svg { transition: transform 0.2s ease; }
    .dock-toggle-btn.open svg { transform: rotate(180deg); }

    #nav {
      position: fixed;
      left: 50%;
      bottom: 40px;
      z-index: 40;
      width: auto;
      max-width: min(96vw, 900px);
      flex-direction: row;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      row-gap: 8px;
      column-gap: 16px;
      padding: 26px 22px;
      border-radius: 28px;
      border: 1px solid var(--mac-vibrancy-hairline);
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.4), 0 1px 0 rgba(255, 255, 255, 0.06) inset;
      opacity: 0;
      transform: translateX(-50%) translateY(10px) scale(0.96);
      pointer-events: none;
      transition: opacity 0.16s ease, transform 0.18s cubic-bezier(.2, 1.2, .4, 1);
    }
    #nav.dock-open {
      opacity: 1;
      transform: translateX(-50%) translateY(0) scale(1);
      pointer-events: auto;
    }
    #nav.collapsed { width: auto; }
    #nav .nav-label-top,
    #nav .nav-spacer,
    #nav .nav-collapse-btn,
    #nav .theme-toggle-wrap {
      display: none;
    }
    /* 아이콘 아래에 작은 캡션을 붙여서, 사이드바가 펼쳐졌을 때 보이던
       계정 이름 / 로그아웃까지 남은 시간 / 메뉴 이름을 이 독(dock)에서도 알 수 있게 한다.
       모든 항목(메뉴 아이콘 / 계정 / 로그아웃)의 세로 높이를 동일하게 맞춰서,
       독 안에서 아이콘들이 전부 같은 가운데 선에 나란히 놓이도록 한다. */
    #nav .nav-btn {
      width: auto;
      margin: 0;
      padding: 12px 20px;
      border-radius: 18px;
      white-space: nowrap;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 5px;
      transition: color 0.12s ease, background 0.12s ease, transform 0.15s cubic-bezier(.2,1.4,.4,1);
    }
    /* 사이드바를 예전에 "접기" 해둔 적이 있으면 #nav에 .collapsed가 남아있어
       라벨이 강제로 숨겨지므로, 이 독(dock)에서는 항상 보이도록 덮어쓴다 */
    #nav .nav-btn .nav-text,
    #nav .nav-account-name .nav-text,
    #nav.collapsed .nav-btn .nav-text,
    #nav.collapsed .nav-account-name .nav-text,
    #nav.collapsed .nav-logout-btn .nav-text {
      display: block !important;
      font-size: 11.5px;
      color: var(--text-faint);
    }
    #nav .nav-btn.active .nav-text { color: #ffffff; }
    #nav .nav-btn:hover { transform: translateY(-4px) scale(1.06); background: var(--mac-vibrancy-hairline); }
    #nav .nav-btn.active:hover { transform: translateY(-4px) scale(1.06); }

    /* 아이콘 자체 크기를 더 키운다 (기본 15px → 28px) */
    #nav .nav-btn .icon-emo,
    #nav .nav-account-name .icon-emo,
    #nav .nav-logout-btn .icon-emo {
      width: 28px;
      height: 28px;
    }

    #nav .nav-account {
      flex-direction: row;
      align-items: center;
      gap: 20px;
      padding: 0 4px;
    }
    #nav .nav-account-name {
      max-width: 96px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 5px;
      padding: 12px 6px;
    }
    #nav .nav-account-name .nav-text {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 96px;
    }
    /* 로그아웃 버튼(아이콘+라벨)은 다른 아이콘들과 정확히 같은 높이를 갖도록 하고,
       자동 로그아웃 남은 시간 + 연장 버튼은 그 흐름 밖(절대 위치)으로 빼서 캡션처럼 붙인다.
       이렇게 하면 로그아웃 항목도 다른 아이콘들과 똑같은 높이가 되어, 독 세로 가운데 선에
       모든 아이콘이 완벽히 정렬된다. */
    #nav .nav-logout-wrap {
      position: relative;
      display: flex;
    }
    #nav .nav-session-row {
      position: absolute;
      top: 100%;
      left: 50%;
      transform: translateX(-50%);
      margin-top: 5px;
      display: flex;
      align-items: center;
      gap: 5px;
      white-space: nowrap;
    }
    #nav .global-session-badge { font-size: 10px; padding: 2px 8px; }
    #nav .nav-session-extend-btn { font-size: 10px; padding: 1px 7px; }
    #nav .nav-logout-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 5px;
      padding: 12px 8px;
      border-radius: 14px;
    }
    /* 계정/로그아웃 묶음과 메뉴 아이콘들 사이를 나누는 세로 구분선.

  /* ---------- 모바일 전역 최적화 ---------- */
  @media (max-width: 720px) {
    /* iOS Safari는 입력창 글자 크기가 16px보다 작으면 탭할 때 화면을 자동으로 확대시켜버려서
       사용성이 크게 떨어진다. 모바일에서는 모든 입력 요소 글자 크기를 16px 이상으로 고정한다. */
    input, select, textarea { font-size: 16px !important; }

    #page-area { padding: 14px 10px 84px; }

    /* 손가락 터치 기준으로 버튼 최소 크기를 넉넉하게 확보 */
    .icon-btn { width: 40px; height: 40px; }

  @media (max-width: 600px) {

    /* 테마 선택 버튼의 글자 라벨만 계속 숨겨서 공간을 아낀다 */
    #nav .theme-picker-label, #nav .theme-picker-chevron { display: none; }

    /* 아이콘 아래에 작은 글씨로 캡션을 붙여서, 사이드바가 펼쳐졌을 때 보이던
       계정 이름 / 로그아웃까지 남은 시간 / 메뉴 이름을 여기서도 바로 알 수 있게 한다 */
    .nav-btn, .nav-account-name, .nav-logout-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      margin: 0;
      flex-shrink: 0;
    }
    .nav-btn { padding: 9px 13px; font-size: 18px; }
    /* 사이드바를 예전에 "접기" 해둔 적이 있으면 #nav에 .collapsed가 남아있어
       라벨이 강제로 숨겨지므로, 이 화면(아이콘 바)에서는 항상 보이도록 덮어쓴다 */
    .nav-btn .nav-text,
    .nav-account-name .nav-text,
    .nav-logout-btn .nav-text,
    #nav.collapsed .nav-btn .nav-text,
    #nav.collapsed .nav-account-name .nav-text,
    #nav.collapsed .nav-logout-btn .nav-text {

    /* 아이콘 자체 크기를 키운다 (기본 15px → 22px) */
    .nav-btn .icon-emo,
    .nav-account-name .icon-emo,

      height: 22px;

    /* 로그아웃 버튼(아이콘+라벨)을 위, 남은 시간+연장 버튼을 캡션처럼 아래에 배치 */
    .nav-logout-wrap {

    .nav-session-row { display: flex; align-items: center; gap: 4px; }
    .global-session-badge { font-size: 9.5px; padding: 1px 6px; }
    .nav-session-extend-btn { font-size: 9.5px; padding: 1px 6px; }

  .chip.bridge-l.bridge-r { width: calc(100% + 12px); }
  .chip-more { font-size: 11.5px; color: var(--text-faint); padding: 0 6px; }

  .side-date { font-size: 28px; margin-bottom: 2px; }
  .side-date .wd { color: var(--text-dim); font-size: 15px; }
  .status { font-size: 12px; color: var(--text-faint); height: 14px; }

  .legend { display: flex; align-items: center; gap: 14px; margin: 10px 0 16px; font-size: 13px; color: var(--text-dim); flex-wrap: wrap; }
  .legend .item { display: flex; align-items: center; gap: 5px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
  .dot.memo { background: var(--accent); }
  .dot.event { background: var(--green); }
  .hide-done { display: flex; align-items: center; gap: 5px; margin-left: auto; cursor: pointer; color: var(--text-faint); }
  .hide-done input { accent-color: var(--accent); width: 13px; height: 13px; cursor: pointer; }

  .entries { display: flex; flex-direction: column; gap: 9px; margin-bottom: 18px; max-height: 420px; overflow-y: auto; }
  .entry {
    display: flex; align-items: flex-start; gap: 10px;
    background: var(--elevated); border-left: 3px solid var(--accent);
    border-radius: 8px; padding: 10px 12px;
  }
  .entry.event { border-left-color: var(--green); }
  .entry.done { border-left-color: var(--hairline); opacity: 0.55; }
  .entry .body { flex: 1; min-width: 0; }
  .entry .meta-row { display: flex; align-items: center; gap: 8px; margin-bottom: 2px; flex-wrap: wrap; }
  .entry .time { font-size: 12px; color: var(--text-dim); }
  .entry .range-badge {
    font-size: 11.5px; color: var(--text-dim); background: var(--hairline);
    padding: 1px 7px; border-radius: 999px;
  }
  .entry .priority-tag { display: flex; align-items: center; gap: 3px; font-size: 11.5px; color: var(--red); }
  .entry .text { font-size: 16px; line-height: 1.45; word-break: break-word; }
  .entry.done .text { text-decoration: line-through; color: var(--text-faint); }
  .entry button.del {
    background: none; border: none; color: var(--text-faint); cursor: pointer;
    padding: 2px; display: flex; border-radius: 5px; flex-shrink: 0; font-size: 16px;
  }
  .entry button.del:hover { color: var(--red); background: #ffffff0d; }
  .check-btn {
    width: 18px; height: 18px; border: 1.5px solid var(--hairline); border-radius: 50%;
    margin-top: 1px; display: flex; align-items: center; justify-content: center;
    color: var(--bg); background: none; cursor: pointer; padding: 0; flex-shrink: 0;
    transition: background 0.15s ease, border-color 0.15s ease; font-size: 12px;
  }
  .entry.done .check-btn { background: var(--accent); border-color: var(--accent); }
  .entry:not(.done) .check-btn:hover { border-color: var(--accent); }

  .empty {
    color: var(--text-faint); font-size: 14px; font-style: italic; padding: 18px 4px;
    text-align: center; border: 1px dashed var(--hairline); border-radius: 10px; margin-bottom: 16px;
  }

  .upcoming { border-top: 1px solid var(--hairline); padding-top: 14px; margin-bottom: 14px; }
  .upcoming-title { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--text-dim); margin-bottom: 9px; }
  .upcoming-list { display: flex; flex-direction: column; gap: 5px; }
  .upcoming-item {
    display: flex; align-items: center; gap: 8px; background: none; border: none;
    border-radius: 6px; padding: 5px 6px; cursor: pointer; text-align: left; width: 100%;
  }
  .upcoming-item:hover { background: var(--elevated); }
  .upcoming-day { font-size: 12.5px; color: var(--text-faint); flex-shrink: 0; }
  .upcoming-star { color: var(--red); flex-shrink: 0; }
  .upcoming-text { font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--text); }
  .upcoming-text.event { color: var(--green); }

  .add-form { border-top: 1px solid var(--hairline); padding-top: 14px; }
  .type-row { display: flex; gap: 6px; margin-bottom: 8px; flex-wrap: wrap; }
  .type-btn {
    background: var(--elevated); border: 1px solid var(--hairline); color: var(--text-dim);
    border-radius: 8px; padding: 6px 0; font-size: 13px; cursor: pointer;
    transition: all 0.15s ease; flex: 1; min-width: 60px;
  }
  .type-btn.memo.active { border-color: var(--accent); color: var(--accent); background: var(--accent-dim); }
  .type-btn.event.active { border-color: var(--green); color: var(--green); background: var(--green-dim); }
  .type-btn.priority { flex: 0 0 auto; padding: 6px 12px; }
  .type-btn.priority.active { border-color: var(--red); color: var(--red); background: var(--red-dim); }
  .type-btn.rangetoggle { flex: 0 0 auto; padding: 6px 12px; }
  .type-btn.rangetoggle.active { border-color: var(--text-dim); color: var(--text); background: var(--elevated); }

  .range-row {
    display: flex; align-items: center; gap: 8px; margin-bottom: 8px;
    background: var(--elevated); border: 1px solid var(--hairline);
    border-radius: 8px; padding: 8px 10px;
  }
  .range-row .date-input {
    background: none; border: none; color: var(--text);
    font-size: 14px; flex: 1; min-width: 0; color-scheme: var(--native-color-scheme, dark);
  }
  .range-row .arrow { color: var(--text-faint); font-size: 14px; flex-shrink: 0; }

  .add-row { display: flex; gap: 6px; }
  .add-input {
    background: var(--elevated); border: 1px solid var(--hairline); color: var(--text);
    border-radius: 8px; padding: 11px 12px; font-size: 15px;
  }
  .add-input::placeholder { color: var(--text-faint); }
  .time-input { width: 96px; }
  .text-input { flex: 1; min-width: 0; }
  .submit-btn {
    background: var(--accent); border: none; color: var(--accent-text); width: 36px;
    border-radius: 8px; display: flex; align-items: center; justify-content: center;
    cursor: pointer; transition: filter 0.15s ease; font-size: 19.5px;
  }
  .submit-btn:hover { filter: brightness(1.1); }

  /* ---------- 캘린더: 오른쪽 컬럼(사이드카드 + 할 일) ---------- */
  .side-col {
    display: flex;
    flex-direction: column;
    gap: 20px;
  }
  .todo-header {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 10px;
    margin-bottom: 4px;
  }
  .todo-title { font-size: 20px; letter-spacing: -0.01em; }
  .todo-count { font-size: 12.5px; color: var(--text-faint); }
  .todo-list {
    display: flex;
    flex-direction: column;
    gap: 8px;
    margin: 12px 0 14px;
    max-height: 260px;
    overflow-y: auto;
  }
  .todo-empty {
    color: var(--text-faint); font-size: 13.5px; font-style: italic; padding: 16px 4px;
    text-align: center; border: 1px dashed var(--hairline); border-radius: 10px;
  }
  .todo-item {
    display: flex; align-items: flex-start; gap: 9px;
    background: var(--elevated); border: 1px solid transparent;
    border-radius: 8px; padding: 9px 10px;
    transition: background 0.15s ease, border-color 0.15s ease;
  }
  .todo-item.done { opacity: 0.55; }
  .todo-item.due-today {
    border-color: var(--red);
    background: var(--red-dim);
  }
  .todo-item .todo-body { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
  .todo-text { font-size: 14.5px; line-height: 1.4; word-break: break-word; }
  .todo-item.done .todo-text { text-decoration: line-through; color: var(--text-faint); }
  .todo-due {
    align-self: flex-start;
    font-size: 11.5px; color: var(--text-dim); background: var(--hairline);
    padding: 1px 7px; border-radius: 999px; white-space: nowrap;
  }
  .todo-due.today { color: var(--bg); background: var(--red); font-weight: 700; }
  .todo-due.over { color: var(--red); background: var(--red-dim); }
  .todo-item button.del {
    background: none; border: none; color: var(--text-faint); cursor: pointer;
    padding: 2px; display: flex; border-radius: 5px; flex-shrink: 0; font-size: 15px;
  }
  .todo-item button.del:hover { color: var(--red); background: #ffffff0d; }
  .todo-add-form { border-top: 1px solid var(--hairline); padding-top: 12px; display: flex; flex-direction: column; gap: 6px; }
  .todo-add-row { display: flex; gap: 6px; }
  .todo-due-input {
    background: var(--elevated); border: 1px solid var(--hairline); color: var(--text);
    border-radius: 8px; padding: 0 10px; font-size: 13px; color-scheme: var(--native-color-scheme, dark); flex: 0 0 132px;
  }
  @media (max-width: 600px) {
    .todo-add-row { flex-wrap: wrap; }
    .todo-add-row .add-input { flex: 1 1 100%; min-width: 0; }
    .todo-due-input { flex: 1 1 auto; height: 38px; }
    .note-body { padding: 0 10px 12px 14px; }
    .interview-textarea, .note-content { font-size: 16px; }
  }

  /* ---------- 업무 정리 페이지 ---------- */
  .notes-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 20px;
    flex-wrap: wrap;
    gap: 10px;
  }
  .notes-title { font-size: 32px; }
  .notes-actions { display: flex; gap: 8px; }
  .ghost-btn {
    background: var(--elevated);
    border: 1px solid var(--hairline);
    color: var(--text-dim);
    border-radius: 7px;
    padding: 8px 14px;
    font-size: 13.5px;
    cursor: pointer;
    transition: border-color 0.12s ease, color 0.12s ease, background 0.12s ease;
  }
  .ghost-btn:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-dim); }

  .inline-form {
    background: var(--panel);
    border: 1px solid var(--hairline);
    border-radius: 14px;
    padding: 16px 18px;
    margin-bottom: 18px;
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    align-items: center;
  }
  .inline-form input[type="text"], .inline-form select {
    background: var(--elevated); border: 1px solid var(--hairline); color: var(--text);
    border-radius: 8px; padding: 9px 12px; font-size: 15px;
  }
  .inline-form input[type="text"] { flex: 1; min-width: 160px; }
  .inline-form .primary-btn {
    background: var(--accent); border: none; color: var(--accent-text);
    border-radius: 8px; padding: 9px 16px; font-size: 14px; cursor: pointer;
  }
  .inline-form .primary-btn:hover { filter: brightness(1.1); }
  .inline-form .cancel-btn {
    background: none; border: 1px solid var(--hairline); color: var(--text-faint);
    border-radius: 8px; padding: 9px 14px; font-size: 14px; cursor: pointer;
  }

  .pinned-block {
    border: 1px solid var(--accent);
    background: var(--accent-dim);
    border-radius: 16px;
    padding: 16px 18px;
    margin-bottom: 22px;
  }
  .pinned-title {
    display: flex; align-items: center; gap: 6px;
    font-size: 14px; color: var(--accent); margin-bottom: 10px;
  }
  .pinned-count { color: var(--text-faint); font-weight: 400; }

  .folder-block {
    background: var(--panel);
    border: 1px solid var(--hairline);
    border-radius: 16px;
    margin-bottom: 16px;
    overflow: hidden;
  }
  .folder-header {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 14px 18px;
    cursor: pointer;
  }
  .folder-header:hover { background: var(--elevated); }
  .folder-chevron { color: var(--text-faint); font-size: 12px; width: 12px; flex-shrink: 0; }
  .folder-name { font-size: 17.5px; flex: 1; }
  .folder-count { font-size: 13px; color: var(--text-faint); }
  .folder-del {
    background: none; border: none; color: var(--text-faint); cursor: pointer;
    padding: 4px; border-radius: 5px; font-size: 14px;
  }
  .folder-del:hover { color: var(--red); background: #ffffff0d; }
  .folder-body { padding: 4px 12px 12px; display: flex; flex-direction: column; gap: 6px; border-radius: 8px; transition: background 0.12s ease; }
  .folder-body.drag-over-zone { background: var(--accent-dim); }
  .folder-empty { color: var(--text-faint); font-size: 13.5px; font-style: italic; padding: 6px 8px 10px; }

  .note-row {
    background: var(--elevated);
    border: 1px solid var(--hairline);
    border-radius: 10px;
    overflow: hidden;
  }
  .note-row.dragging { opacity: 0.4; }
  .note-row.drag-over { border-color: var(--accent); }
  .note-head {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 10px 10px 6px;
  }
  .drag-handle {
    cursor: grab;
    color: var(--text-faint);
    font-size: 15px;
    padding: 4px 2px;
    flex-shrink: 0;
    user-select: none;
  }
  .drag-handle:active { cursor: grabbing; }
  .pin-btn {
    background: none; border: none; cursor: pointer; flex-shrink: 0;
    font-size: 15px; color: var(--text-faint); padding: 2px;
  }
  .pin-btn.pinned { color: var(--accent); }
  .note-title-btn {
    flex: 1;
    min-width: 0;
    background: none;
    border: none;
    color: var(--text);
    font-size: 15.5px;
    text-align: left;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 4px 2px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .note-title-btn .caret { color: var(--text-faint); font-size: 11px; flex-shrink: 0; transition: transform 0.15s ease; }
  .note-title-btn.expanded .caret { transform: rotate(90deg); }
  .note-folder-tag {
    font-size: 11.5px; color: var(--text-faint); background: var(--hairline);
    padding: 1px 7px; border-radius: 999px; flex-shrink: 0;
  }
  .note-del {
    background: none; border: none; color: var(--text-faint); cursor: pointer;
    padding: 4px; border-radius: 5px; font-size: 14px; flex-shrink: 0;
  }
  .note-del:hover { color: var(--red); background: #ffffff0d; }
  .note-body { padding: 0 14px 14px 34px; }
  .note-content {
    width: 100%;
    background: var(--panel);
    border: 1px solid var(--hairline);
    color: var(--text);
    border-radius: 8px;
    padding: 10px 12px;
    font-size: 14.5px;
    line-height: 1.6;
    resize: vertical;
    min-height: 90px;
  }

  .notes-empty {
    text-align: center;
    color: var(--text-faint);
    font-size: 14.5px;
    font-style: italic;
    padding: 40px 10px;
    border: 1px dashed var(--hairline);
    border-radius: 14px;
  }

  /* ---------- 상담사 관리 페이지 ---------- */
  .agent-shell {
    display: grid;
    grid-template-columns: 1fr 1.5fr;
    gap: 20px;
    align-items: start;
  }
  @media (max-width: 900px) {
    .agent-shell { grid-template-columns: 1fr; }
  }
  .agent-list-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    margin-bottom: 14px;
    flex-wrap: wrap;
  }
  .agent-list-title { font-size: 22px; letter-spacing: -0.01em; }
  .agent-list { display: flex; flex-direction: column; gap: 8px; }
  .agent-list-empty {
    color: var(--text-faint); font-size: 14px; font-style: italic; padding: 34px 10px;
    text-align: center; border: 1px dashed var(--hairline); border-radius: 12px;
  }
  .agent-row {
    display: flex; align-items: center; gap: 8px;
    background: var(--elevated); border: 1px solid transparent;
    border-radius: 10px; padding: 4px 10px 4px 6px;
    transition: border-color 0.15s ease, background 0.15s ease;
  }
  .agent-row.selected { border-color: var(--accent); background: var(--accent-dim); }
  .agent-row.dragging { opacity: 0.4; }
  .agent-row.drag-over { border-color: var(--accent); }
  .agent-row-main {
    flex: 1; min-width: 0;
    background: none; border: none; text-align: left; cursor: pointer;
    display: flex; align-items: baseline; gap: 8px;
    padding: 9px 4px;
  }
  .agent-row-name { font-size: 15.5px; color: var(--text); flex-shrink: 0; }
  .agent-row-ldap { font-size: 14px; color: var(--text-dim); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  .agent-summary { font-size: 13px; color: var(--text-dim); margin-bottom: 14px; white-space: nowrap; overflow-x: auto; }
  .agent-controls { display: flex; flex-direction: column; gap: 8px; margin-bottom: 16px; }
  .agent-search-input { width: 100%; }
  .agent-filter-row { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
  .agent-filter-btn {
    background: var(--elevated); border: 1px solid var(--hairline); color: var(--text-dim);
    border-radius: 8px; padding: 6px 12px; font-size: 13px; cursor: pointer;
    transition: all 0.15s ease;
  }
  .agent-filter-btn:hover { color: var(--text); }
  .agent-filter-btn.active { border-color: var(--accent); color: var(--accent); background: var(--accent-dim); }
  .agent-sort-select {
    background: var(--elevated); border: 1px solid var(--hairline); color: var(--text);
    border-radius: 8px; padding: 6px 10px; font-size: 13px; cursor: pointer; margin-left: auto;
  }
  .agent-row-badges { display: flex; gap: 4px; flex-shrink: 0; align-items: center; }
  .master-reset-form {
    flex-basis: 100%; display: flex; flex-direction: row; flex-wrap: wrap; gap: 8px; align-items: flex-end;
    margin: 6px 4px 8px; padding: 12px 12px 10px;
    background: var(--panel); border: 1px solid var(--accent); border-radius: 8px;
  }
  .master-reset-form .login-field { flex: 1; min-width: 160px; }
  .master-reset-form .login-submit { flex-shrink: 0; }
  .master-reset-form .login-error { flex-basis: 100%; }
  .ghost-btn.active { border-color: var(--accent); color: var(--accent); background: var(--accent-dim); }
  .badge.sm { font-size: 11px; padding: 1px 7px; margin-right: 0; white-space: nowrap; }
  .drag-handle-disabled { opacity: 0.25; cursor: default; }

  .agent-detail-card { min-height: 260px; }
  .agent-detail-empty {
    color: var(--text-faint); font-size: 14.5px; font-style: italic;
    text-align: center; padding: 70px 10px;
  }
  .agent-detail-header {
    display: flex; align-items: center; justify-content: space-between;
    gap: 10px; margin-bottom: 18px; flex-wrap: wrap;
  }
  .agent-detail-name { font-size: 24px; letter-spacing: -0.01em; }
  .agent-detail-actions { display: flex; gap: 8px; }
  .ghost-btn.danger:hover { border-color: var(--red); color: var(--red); }
  .agent-field {
    display: flex; flex-direction: column; gap: 4px;
    padding: 12px 0; border-bottom: 1px solid var(--hairline);
  }
  .agent-field:last-child { border-bottom: none; }
  .agent-field-label { font-size: 12px; letter-spacing: 0.06em; color: var(--text-faint); text-transform: uppercase; }
  .agent-field-value { font-size: 15.5px; color: var(--text); }
  .agent-field-empty { color: var(--text-faint); }
  .badge { display: inline-block; font-size: 12.5px; padding: 2px 10px; border-radius: 999px; margin-right: 6px; }
  .badge.voice { color: var(--green); background: var(--green-dim); }
  .badge.chat { color: var(--accent); background: var(--accent-dim); }
  .badge.day { color: var(--orange); background: var(--orange-dim); }
  .badge.night { color: var(--blue); background: var(--blue-dim); }
  .badge.admin { color: var(--red); background: var(--red-dim); }
  .badge.master { color: var(--accent); background: var(--accent-dim); }
  .badge.resigned { color: var(--text-faint); background: var(--hairline); }
  .badge.working { color: var(--green); background: var(--green-dim); }
  /* 리스트에서 클릭 한 번으로 근무중/퇴사를 바로 전환하는 배지 버튼
     - 다른 상태 뱃지(유선/채팅/주간/야간)는 정보 표시용 "알약형" 뱃지
     - 이 버튼은 클릭 가능하다는 걸 알 수 있도록 각진 모양 + 테두리 + 토글 아이콘으로 구분 */
  .badge-btn {
    display: inline-flex; align-items: center; gap: 4px;
    font-size: 12.5px; padding: 2px 9px; border-radius: 6px; margin-right: 6px;
    border: 1px solid currentColor; cursor: pointer; font-family: inherit; line-height: 1.4;
    transition: filter 0.15s ease, transform 0.1s ease, box-shadow 0.15s ease;
  }
  .badge-btn.sm { font-size: 11px; padding: 1px 7px; margin-right: 0; white-space: nowrap; }
  .badge-btn.working { color: var(--green); background: var(--green-dim); border-color: var(--green); }
  .badge-btn.resigned { color: var(--text-faint); background: var(--hairline); border-color: var(--text-faint); }
  .badge-btn::after {
    content: "⇄"; font-size: 0.85em; opacity: 0.75;
  }
  .badge-btn:hover { filter: brightness(1.3); box-shadow: 0 0 0 2px var(--accent-dim); }
  .badge-btn:active { filter: brightness(0.9); transform: scale(0.96); }
  .agent-radio-row { display: flex; gap: 16px; margin-top: 2px; }
  .agent-radio { display: flex; align-items: center; gap: 6px; font-size: 14.5px; color: var(--text); cursor: pointer; }
  .agent-radio input { accent-color: var(--accent); width: 15px; height: 15px; cursor: pointer; }

  .agent-form-title { font-size: 18px; margin-bottom: 16px; }
  .agent-form { display: flex; flex-direction: column; gap: 13px; }
  .agent-form-label { display: flex; flex-direction: column; gap: 6px; font-size: 13px; color: var(--text-dim); }
  .agent-form-label .add-input { width: 100%; }

  /* ===================== 로그인(로컬 전용) 모듈 =====================

  const ACCOUNTS_KEY = "personal-app:accounts";
  const SESSION_KEY = "personal-app:session";
  // 마스터 계정이 다른 계정을 "들어가서 보기" 했을 때, 원래(마스터) 계정으로
  // 돌아올 수 있도록 원래 세션을 잠깐 보관해두는 키.
  const MASTER_ORIGIN_KEY = "personal-app:master-origin";
  // 로그인한 시각을 기록해두는 키. 이 시각으로부터 SESSION_DURATION_MS가
  // 지나면 자동으로 로그아웃시킨다.
  const LOGIN_AT_KEY = "personal-app:login-at";
  const SESSION_DURATION_MS = 5 * 60 * 60 * 1000; // 5시간

  const HAS_SUBTLE_CRYPTO = !!(window.crypto && window.crypto.subtle);
  // 예전(salt 없는 단순 해시) 방식 — 신규 계정에는 쓰지 않고, 예전에 만든
  // 계정을 로그인할 때 한 번 확인해서 새 방식으로 자동 업그레이드하는 용도로만 남겨둔다.
  function legacyHash(str) {
    let h = 0;
    for (let i = 0; i < str.length; i++) {
      h = (h << 5) - h + str.charCodeAt(i);
      h |= 0;
    }
    return String(h);
  }
  function genSalt() {
    const bytes = crypto.getRandomValues(new Uint8Array(16));
    return Array.from(bytes).map((b) => b.toString(16).padStart(2, "0")).join("");
  }
  async function sha256Hex(str) {
    const bytes = new TextEncoder().encode(str);
    const digest = await crypto.subtle.digest("SHA-256", bytes);
    return Array.from(new Uint8Array(digest)).map((b) => b.toString(16).padStart(2, "0")).join("");
  }
  // salt를 붙여 비밀번호를 해시한다. SubtleCrypto를 쓸 수 없는 예외적인 환경에서는
  // (로그인 자체가 막히지 않도록) 예전 단순 해시로 대신한다.
  async function hashPassword(password, salt) {
    if (!HAS_SUBTLE_CRYPTO) return legacyHash(`${salt}:${password}`);
    return sha256Hex(`${salt}:${password}`);
  }
  function loadAccounts() {
    try {
      const raw = localStorage.getItem(ACCOUNTS_KEY);
      const parsed = raw ? JSON.parse(raw) : [];
      return Array.isArray(parsed) ? parsed : [];
    } catch (e) { return []; }
  }
  function saveAccounts(list) {
    try { localStorage.setItem(ACCOUNTS_KEY, JSON.stringify(list)); } catch (e) {}
  }
  function getSession() {
    try { return localStorage.getItem(SESSION_KEY); } catch (e) { return null; }
  }
  function setSession(accountId) {
    try { localStorage.setItem(SESSION_KEY, accountId); } catch (e) {}
  }
  function clearSession() {
    try { localStorage.removeItem(SESSION_KEY); } catch (e) {}
  }
  function getMasterOrigin() {
    try { return localStorage.getItem(MASTER_ORIGIN_KEY); } catch (e) { return null; }
  }
  function setMasterOrigin(accountId) {
    try { localStorage.setItem(MASTER_ORIGIN_KEY, accountId); } catch (e) {}
  }
  function clearMasterOrigin() {
    try { localStorage.removeItem(MASTER_ORIGIN_KEY); } catch (e) {}
  }
  function getLoginAt() {
    try { return localStorage.getItem(LOGIN_AT_KEY); } catch (e) { return null; }
  }
  function setLoginAt(timestamp) {
    try { localStorage.setItem(LOGIN_AT_KEY, String(timestamp)); } catch (e) {}
  }
  function clearLoginAt() {
    try { localStorage.removeItem(LOGIN_AT_KEY); } catch (e) {}
  }
  // 자동 로그아웃까지 남은 시간(ms)을 계산한다. 로그인 시각 기록이 없으면 0으로 본다.
  function getSessionRemainingMs() {
    const loginAt = Number(getLoginAt());
    if (!loginAt) return 0;
    return SESSION_DURATION_MS - (Date.now() - loginAt);
  }
  function formatRemainingTime(ms) {
    if (ms <= 0) return "0분";
    const totalMinutes = Math.floor(ms / 60000);
    const h = Math.floor(totalMinutes / 60);
    const m = totalMinutes % 60;
    if (h > 0) return `${h}시간 ${m}분`;
    return `${m}분`;
  }
  function updateSessionRemainingDisplay() {
    const el = document.getElementById("global-session-badge");
    if (el) {
      el.innerHTML = `${ICON_CLOCK} ${formatRemainingTime(getSessionRemainingMs())}`;
      el.classList.add("visible");
    }
  }
  // 마스터 계정이 다른 계정으로 들어가서 볼 때 쓰는 함수.
  // 지금 세션(마스터)을 origin으로 저장해두고, 세션을 대상 계정으로 바꾼다.
  async function masterEnterAccount(targetAccountId) {
    const origin = getMasterOrigin() || getSession();
    if (origin) setMasterOrigin(origin);
    setSession(targetAccountId);
    await flushCloudWrites();
    location.reload();
  }
  // 마스터가 다른 계정을 보다가 원래 마스터 계정으로 돌아간다.
  async function masterReturnToOrigin() {
    const origin = getMasterOrigin();
    if (!origin) return;
    clearMasterOrigin();
    setSession(origin);
    await flushCloudWrites();
    location.reload();
  }
  // 계정을 삭제한다. 현재 로그인 중인 계정이거나, 남은 계정이 1개뿐이면 삭제하지 않는다.
  // 계정을 지울 때 그 계정의 개인 데이터(acct:{id}: 로 시작하는 저장 값)도 함께 정리한다.
  function deleteAccount(accountId) {
    const list = loadAccounts();
    if (list.length <= 1) return { ok: false, reason: "마지막 남은 계정은 삭제할 수 없어요." };
    if (accountId === CURRENT_ACCOUNT_ID) return { ok: false, reason: "현재 로그인 중인 계정은 삭제할 수 없어요." };
    const next = list.filter((a) => a.id !== accountId);
    saveAccounts(next);
    try {
      const prefix = `acct:${accountId}:`;
      const keysToRemove = [];
      for (let i = 0; i < localStorage.length; i++) {
        const k = localStorage.key(i);
        if (k && k.indexOf(prefix) === 0) keysToRemove.push(k);
      }
      keysToRemove.forEach((k) => localStorage.removeItem(k));
    } catch (e) { /* 데이터 정리 실패해도 계정 삭제 자체는 유지 */ }
    return { ok: true };
  }
  // 마스터가 다른 계정의 비밀번호를 새 비밀번호로 초기화한다.
  async function resetAccountPassword(accountId, newPassword) {
    if (!newPassword || newPassword.length < 4) return { ok: false, reason: "비밀번호는 4자 이상으로 만들어주세요." };
    const list = loadAccounts();
    const idx = list.findIndex((a) => a.id === accountId);
    if (idx === -1) return { ok: false, reason: "계정을 찾을 수 없어요." };
    const salt = genSalt();
    const passwordHash = await hashPassword(newPassword, salt);
    list[idx] = { ...list[idx], salt, passwordHash };
    saveAccounts(list);
    return { ok: true };
  }
  // 마스터가 다른 계정의 이름(아이디)을 바꾼다. 이미 쓰이고 있는 이름으로는 바꿀 수 없다.
  function renameAccount(accountId, newUsername) {
    const trimmed = (newUsername || "").trim();
    if (!trimmed) return { ok: false, reason: "계정 이름을 입력해주세요." };
    const list = loadAccounts();
    const idx = list.findIndex((a) => a.id === accountId);
    if (idx === -1) return { ok: false, reason: "계정을 찾을 수 없어요." };
    const norm = trimmed.toLowerCase();
    const dup = list.find((a) => a.id !== accountId && a.username.toLowerCase() === norm);
    if (dup) return { ok: false, reason: "이미 사용 중인 계정 이름이에요." };
    list[idx] = { ...list[idx], username: trimmed };
    saveAccounts(list);
    return { ok: true };
  }
  function findAccountByUsername(username) {
    const norm = username.trim().toLowerCase();
    return loadAccounts().find((a) => a.username.toLowerCase() === norm) || null;
  }
  function findAccountById(id) {
    return loadAccounts().find((a) => a.id === id) || null;
  }
  async function logout() {
    clearSession();
    clearMasterOrigin();
    clearLoginAt();
    await flushCloudWrites();
    location.reload();
  }
