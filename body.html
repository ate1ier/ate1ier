<body>
<div id="boot-loader"><b>Loading...</b><div class="boot-loader-bar"><i></i></div></div>
<script>
(function () {
  try {
    var m = localStorage.getItem("app-theme-mode");
    if (m && m !== "dark") document.documentElement.setAttribute("data-theme", m);
  } catch (e) {}
  window.__bootStart = Date.now();
  // 방금 로그인/계정 생성으로 들어온 경우(로그인 화면이 새로고침을 거쳐 앱으로 넘어가는 중)에는
  // "Loading..." 문구 없이 로그인 화면과 같은 배경만 잠깐 덮어뒀다가, 앱이 준비되면 곧바로
  // 부드럽게 걷어낸다(최소 대기 시간 없음).
  window.__bootHandoff = false;
  try { window.__bootHandoff = sessionStorage.getItem("app:just-logged-in") === "1"; } catch (e) {}
  // 방금 로그아웃해서 새로고침된 경우에도 "Loading..." 없이 같은 방식으로 로그인 화면으로 넘어간다.
  // (이 표시는 여기서 바로 읽고 지운다 — 다음 새로고침에는 영향을 주지 않도록)
  try {
    if (sessionStorage.getItem("app:just-logged-out") === "1") {
      window.__bootHandoff = true;
      sessionStorage.removeItem("app:just-logged-out");
    }
  } catch (e) {}
  if (window.__bootHandoff) {
    var bl = document.getElementById("boot-loader");
    if (bl) { bl.className = "boot-handoff"; bl.innerHTML = ""; }
  }
  // 로그인 화면이든 앱 화면이든, 실제로 그릴 준비가 끝난 시점에 이 함수를
  // 한 번 호출해준다. 부팅 화면이 뜬 지 2초가 안 됐으면 2초를 채운 뒤에,
  // 이미 2초가 지났으면 곧바로 서서히 사라진다.
  window.__hideBootLoader = function () {
    var el = document.getElementById("boot-loader");
    if (!el || el.dataset.hiding) return;
    el.dataset.hiding = "1";
    var elapsed = Date.now() - (window.__bootStart || Date.now());
    var wait = window.__bootHandoff ? 0 : Math.max(0, 2000 - elapsed);
    setTimeout(function () {
      el.classList.add("boot-loader-hide");
      setTimeout(function () {
        if (el && el.parentNode) el.parentNode.removeChild(el);
        document.documentElement.classList.remove("boot-handoff-pre");
      }, window.__bootHandoff ? 800 : 550);
    }, wait);
  };
})();
</script>
<div id="layout">
  <div id="page-area"><div id="page-inner"></div></div>
  <div id="nav-dock">
    <div id="global-search-root"></div>
    <div id="nav"></div>
  </div>
</div>
<div id="utility-dock-root">
  <div id="refresh-toggle-root"></div>
  <div id="undo-toggle-root"></div>
  <div id="settings-toggle-root"></div>
  <button class="utility-dock-toggle-btn" id="utility-dock-toggle-btn" type="button" aria-haspopup="true" aria-expanded="false" aria-label="바로가기 메뉴 열기" title="바로가기 메뉴 열기">
    <svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><path d="M2 9l5-4 5 4" stroke="currentColor" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </button>
</div>
<button class="dock-toggle-btn" id="dock-toggle-btn" type="button" aria-haspopup="true" aria-expanded="false" aria-label="메뉴 열기" title="메뉴 열기">
  <svg width="18" height="18" viewBox="0 0 14 14" aria-hidden="true"><path d="M2 5l5 4 5-4" stroke="currentColor" stroke-width="2.1" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
</button>
