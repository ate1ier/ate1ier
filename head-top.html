<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<style>html.boot-handoff-pre { background: #060814; }</style>
<script>
// 로그인/로그아웃 직후 새로고침된 경우, 첫 화면이 그려지기 전에(본문이 파싱되기 전에)
// 미리 표시해둬서 검은 "Loading..." 화면이 한 프레임이라도 비치지 않게 한다.
try {
  if (sessionStorage.getItem("app:just-logged-in") === "1" || sessionStorage.getItem("app:just-logged-out") === "1") {
    document.documentElement.classList.add("boot-handoff-pre");
  }
} catch (e) {}
</script>
<title>업무 종합 관리</title>
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" type="image/png" sizes="192x192" href="favicon-192x192.png">
<!-- 성능 최적화: 아래 폰트/스크립트를 실제로 요청하기 전에 CDN 도메인과 미리
     연결(DNS+TLS)해둬서 접속 지연을 줄인다. 화면에는 아무 영향 없음. -->
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/font-kopub@1.0/kopubdotum.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/font-kopub@1.0/kopubbatang.min.css">
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
<!-- 성능 최적화: 예전에는 이 4개 스크립트(특히 exceljs)가 아무 속성 없이 로드되어
     브라우저가 이걸 전부 내려받고 실행할 때까지 <body>를 그리지 못하고 멈춰 있었다
     (저사양 PC에서 "버벅임"으로 느껴지는 가장 큰 원인). defer를 붙이면 브라우저가
     HTML 파싱/화면 구성을 먼저 마치고, 이 스크립트들은 그 뒤에 "원래와 똑같은 순서로"
     실행되므로 기능은 완전히 동일하게 동작하면서 로딩(로고/스피너)이 훨씬 빨리 보인다. -->
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
